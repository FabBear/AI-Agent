[project]
name = "fabbear-ai-agent"
version = "0.1.0"
description = "FabBear AI agent backend workspace"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub>=0.23.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.8",
    "langsmith>=0.1.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "tavily-python>=0.3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.4.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
