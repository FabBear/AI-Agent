[project]
name = "fabbear-ai-agent"
version = "0.1.0"
description = "FabBear AI agent backend workspace"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.111.0",
    "huggingface-hub>=0.23.0",
    "httpx>=0.27.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=0.1.8",
    "langgraph>=1.2.0",
    "langsmith>=0.1.0",
    "mlflow-skinny>=2.13.0",
    "networkx>=3.6.1",
    "numpy>=2.4.5",
    "openai>=1.30.0",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "qdrant-client[fastembed]>=1.9.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4",
    "shap>=0.51.0",
    "simpy>=4.1.1",
    "statsmodels>=0.14.0",
    "tavily-python>=0.3.3",
    "tenacity>=9.1.4",
    "openpyxl>=3.1.0",
    "gymnasium>=0.29.0",
    "uvicorn[standard]>=0.29.0",
    "xgboost>=3.2.0",
    "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = [
    "anyio>=4.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
