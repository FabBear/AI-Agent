[project]
name = "fabbear-ai-agent"
version = "0.1.0"
description = "FabBear AI agent backend workspace"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub>=0.23.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=0.1.8",
    "langgraph>=1.2.0",
    "langsmith>=0.1.0",
    "networkx>=3.6.1",
    "numpy>=2.4.5",
    "openai>=1.30.0",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.4",
    "shap>=0.51.0",
    "tavily-python>=0.3.3",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.4.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
