name: "🧹 Chore"
description: AI Agent 개발에 필요한 설정, 문서, 평가 데이터, 운영 작업을 요청합니다.
title: "[CHORE] "
labels: ["🧹 Chore"]

body:
  - type: dropdown
    id: component
    attributes:
      label: "대상 영역"
      options:
        - "Agent Config"
        - "Prompt Asset"
        - "Evaluation Dataset"
        - "Tool / Integration Config"
        - "Model / Provider Config"
        - "Observability / Monitoring"
        - "Deployment / Runtime"
        - "Docs"
        - "Repository"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "배경"
      description: "어떤 AI Agent 개발/운영 맥락에서 이 작업이 필요한지 설명해 주세요."
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: "작업 내용"
      description: "진행해야 할 작업을 체크리스트로 작성해 주세요."
      value: |
        - [ ]
        - [ ]
    validations:
      required: false

  - type: textarea
    id: additional_info
    attributes:
      label: "추가 정보"
      description: "추가로 공유할 내용이 있다면 자유롭게 작성해 주세요."
    validations:
      required: false
